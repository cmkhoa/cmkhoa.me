name: Portfolio quality and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      external_links:
        description: Also audit third-party links (can fail due to external outages)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATSBY_TELEMETRY_DISABLED: '1'
      GATSBY_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production site
        run: npm run build
      - name: Check pages, links, and desktop/mobile behavior
        run: npm test
      - name: Audit external links (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_links }}
        run: npm run test:external
      - name: Save failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-check-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy GitHub Pages
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GATSBY_TELEMETRY_DISABLED: '1'
      GATSBY_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build for the configured Pages path
        run: npm run build -- --prefix-paths
        env:
          GATSBY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the Pages build
        run: npm test
        env:
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
      - name: Save Pages failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-browser-check-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
